<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Withings Callback</title></head>
<body>
  <h1>Withings Callback</h1>
  <p id="info">Keine Parameter erhalten.</p>
  <script>
    const p = new URLSearchParams(location.search);
    if (p.get("code")) {
      document.getElementById("info").textContent =
        "code: " + p.get("code") + "  |  state: " + p.get("state") +
        "  (Code ist nur 30 Sekunden gültig)";
    }
  </script>
</body>
</html>
